[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyreconcile"
version = "0.1.0"
description = "Reconcile Stripe payouts with Wise, Revolut Business and Mercury bank exports."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
sheets = ["gspread>=6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
anyreconcile = "anyreconcile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
